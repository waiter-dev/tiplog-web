<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TipLog – App laden</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#17130E;color:#F7F3EC;font-family:'DM Mono',ui-monospace,monospace;
       font-size:14px;letter-spacing:.05em}
</style>
</head>
<body>
<p>EINEN MOMENT &hellip;</p>
<script>
var APPSTORE  = null; // z.B. 'https://apps.apple.com/at/app/tiplog/id1234567890'
var PLAYSTORE = null; // z.B. 'https://play.google.com/store/apps/details?id=at.tiplog.app'
var FALLBACK  = 'https://tiplog.at';

var ua = navigator.userAgent || '';
var ziel = FALLBACK;
if (/iPhone|iPad|iPod/i.test(ua))      ziel = APPSTORE  || FALLBACK;
else if (/Android/i.test(ua))          ziel = PLAYSTORE || FALLBACK;

location.replace(ziel);
</script>
<noscript><p><a href="https://tiplog.at" style="color:#F7F3EC">Weiter zu tiplog.at</a></p></noscript>
</body>
</html>
