<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>E-Mail bestätigt · TipLog</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       background:#f4f4f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:440px;width:100%;background:#fff;border-radius:18px;overflow:hidden;
        box-shadow:0 4px 24px rgba(0,0,0,0.06);}
  .head{background:linear-gradient(135deg,#6c5ce7,#a29bfe);padding:40px 32px;text-align:center;}
  .head .emoji{font-size:44px;line-height:1;}
  .head .name{color:#fff;font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-top:10px;}
  .body{padding:32px;text-align:center;}
  .check{width:56px;height:56px;border-radius:50%;background:rgba(46,213,115,0.12);
         display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;}
  h1{font-size:21px;font-weight:700;color:#1a1a2e;margin-bottom:12px;}
  p{font-size:15px;line-height:1.6;color:#555;margin-bottom:8px;}
  .btn{display:inline-block;background:#6c5ce7;color:#fff;text-decoration:none;font-size:15px;
       font-weight:700;padding:14px 32px;border-radius:12px;margin-top:20px;border:none;cursor:pointer;}
  .foot{font-size:12px;color:#aaa;margin-top:28px;padding-top:20px;border-top:1px solid #eee;}
  .foot a{color:#aaa;}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="emoji">🍽️</div>
      <div class="name">TipLog</div>
    </div>
    <div class="body">
      <div class="check">✅</div>
      <h1>E-Mail bestätigt!</h1>
      <p>Danke – deine E-Mail-Adresse ist jetzt bestätigt.</p>
      <p>Öffne die TipLog-App und melde dich mit deiner E-Mail und deinem Passwort an. Viel Erfolg beim Tracken!</p>

      <div class="foot">© TipLog · <a href="https://tiplog.at">tiplog.at</a></div>
    </div>
  </div>
</body>
</html>
